name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version numbers match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version:           $TAG" pinora.php
          grep -q "Stable tag: $TAG" readme.txt
          grep -q "define( 'PINORA_VERSION', '$TAG' );" pinora.php

      - name: Build the zip
        run: |
          mkdir -p build/pinora
          rsync -a --exclude-from=.distignore ./ build/pinora/
          cd build && zip -rq pinora.zip pinora

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/pinora.zip
          generate_release_notes: true

      - name: Deploy to WordPress.org
        if: env.SVN_USERNAME != ''
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: pinora
